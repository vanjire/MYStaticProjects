<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .bu{
        display: flex;
        align-items: center;
      width : 50px;
      height: 25px;
       background-color: rgba(4, 11, 4,0.8);
        border-radius: 20px;
        border: 1px solid lightgray;
    }
   .ci{
    
    width: 20px;
    height: 80%;
    border-radius: 100%;
    background-color:lightgray;
   }
    
</style>
<script>
    function re()
    {
        
         document.getElementById('kk').style.transition='margin-left 0.7s ease 0s';
          document.getElementById('kk').style.marginLeft='auto';
          document.getElementById('ki').style.backgroundColor='blue';
          document.getElementById('kk').setAttribute("onclick","pe()");
          
    }
    function pe(){
        document.getElementById('ki').style.backgroundColor='rgba(4, 11, 4,0.8)';
        document.getElementById('kk').style.transition='margin-left 0.3s ease 0s';
          document.getElementById('kk').style.marginLeft='0px';
           document.getElementById('kk').setAttribute("onclick","re()");
    }
</script>
<body>
   <div class="bu" id="ki"><div class="ci" onclick="re()" id="kk"></div></div>
</body>
</html>
